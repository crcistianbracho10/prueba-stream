worker_processes auto;
rtmp_auto_push on;
events {}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Entrada de tu señal desde OBS
        application live {
            live on;
            record off;

            # Recodificación a 720p estable (3000 kbps)
            exec ffmpeg -i rtmp://localhost:1935/live/$name
                -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k
                -vf "scale=1280:720" -r 30 -g 60
                -c:a aac -b:a 128k -ar 44100
                -f flv rtmp://localhost:1935/salida/$name;
        }

        # Salida hacia tu plataforma final
        application salida {
            live on;
            record off;
            push DESTINO_AQUI;
        }
    }
}
